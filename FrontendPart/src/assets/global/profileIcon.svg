<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C8EBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A6FA5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#E8EFF8;stop-opacity:0.9" />
    </linearGradient>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Body / torso (clipped to circle) -->
  <ellipse cx="50" cy="85" rx="26" ry="20" fill="url(#figureGrad)" clip-path="url(#circle)"/>

  <!-- Head -->
  <circle cx="50" cy="38" r="16" fill="url(#figureGrad)"/>

  <!-- Subtle shadow under head -->
  <ellipse cx="50" cy="54.5" rx="11" ry="2.5" fill="rgba(74,111,165,0.18)"/>
</svg>
